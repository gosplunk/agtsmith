    benchmark_case: windows_credential_access_5379_24h
    format: json
    source: WinEventLog:Security
    payload:
      EventCode: "5379"
      EventID: "5379"
      SubjectUserName: "{user}"
      TargetName: "{target}"
      CountOfCredentialsReturned: "{count}"
      ClientProcessId: "1234"
      Computer: agtsmith-win-lab
      lab_data_source: agtsmith_generator
    fields:
      user: ["alice", "bob"]
      target: ["MicrosoftAccount:target=storage", "LegacyGeneric:target=slack"]
      count: ["1", "2"]
    verify_query: 'search index={index} sourcetype="{sourcetype}" lab_data_source=agtsmith_generator (EventCode=5379 OR EventID=5379) earliest=-24h | stats count'
    min_expected_rows: 1

  win_4672:
    domain: windows_auth
    benchmark_case: windows_privilege_assigned_4672_24h
    format: json
    source: WinEventLog:Security
    payload:
      EventCode: "4672"
      EventID: "4672"
      Message: "Special privileges assigned to new logon."
      SubjectUserName: "{user}"
      PrivilegeList: "SeSecurityPrivilege\tSeTakeOwnershipPrivilege"
      Computer: agtsmith-win-lab
      lab_data_source: agtsmith_generator
    fields:
      user: ["administrator", "SYSTEM", "alice"]
    verify_query: 'search index={index} sourcetype="{sourcetype}" lab_data_source=agtsmith_generator (EventCode=4672 OR EventID=4672) earliest=-24h | stats count'
