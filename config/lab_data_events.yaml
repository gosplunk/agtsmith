    verify_query: 'search index={index} sourcetype="{sourcetype}" lab_data_source=agtsmith_generator (EventCode=4625 OR EventID=4625) earliest=-24h | stats count'
    min_expected_rows: 1

  linux_failed_ssh_cross:
    domain: linux_auth_test
    benchmark_case: failed_login_cross_platform_24h
    format: raw
    source: /var/log/auth.log
    templates:
      - 'Failed password for {user} from {src_ip} port {port} ssh2'
    fields:
      user: ["admin", "root", "testuser"]
      src_ip: ["10.0.0.99", "10.0.0.88"]
      port: ["22"]
    verify_query: 'search index={index} sourcetype="{sourcetype}" lab_data_source=agtsmith_generator "Failed password" earliest=-24h | stats count'
