        tlsDetails:
          tlsVersion: TLSv1.3
          cipherSuite: TLS_AES_128_GCM_SHA256
          clientProvidedHostHeader: synthetic-audit-archive.s3.us-west-2.amazonaws.com
      - eventSource: ec2.amazonaws.com
        eventName: RunInstances
        readOnly: false
        requestParameters:
          instancesSet:
            items:
              - imageId: ami-0abcdef1234567890
