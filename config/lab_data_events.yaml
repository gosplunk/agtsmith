# Production-shaped synthetic fixtures for Splunk SPL development.
# Values are fictional, but raw structure and field names follow source-native schemas.

defaults:
  host: agtsmith-lab-gen
  lab_data_source: agtsmith_generator
  lab_data_version: fidelity_v2
  count_per_run: 50
  time_jitter_hours: 6

event_sets:
  linux_failed_ssh: &linux_failed_ssh
    domain: linux_auth
    benchmark_case: linux_auth_failures_24h
    format: raw
    source: /var/log/auth.log
    templates:
      - '{rfc3164_time} {event_host} sshd[{process_id}]: Failed password for invalid user {user} from {src_ip} port {src_port} ssh2'
      - '{rfc3164_time} {event_host} sshd[{process_id}]: Failed password for {user} from {src_ip} port {src_port} ssh2'
      - '{rfc3164_time} {event_host} sshd[{process_id}]: Invalid user {user} from {src_ip} port {src_port}'
    fields:
      event_host: [linux-auth-01, linux-auth-02]
      user: [admin, root, testuser, deploy, oracle]
      src_ip: [10.0.0.99, 10.0.0.88, 192.168.1.50, 203.0.113.10]
      src_port: [49822, 51214, 58431]
    verify_query: 'search index={index} sourcetype="{sourcetype}" lab_data_source=agtsmith_generator lab_data_version=fidelity_v2 ("Failed password" OR "Invalid user") earliest=-24h | stats count'
    min_expected_rows: 1

  linux_sudo:
    domain: linux_auth
    benchmark_case: linux_privilege_escalation_24h
    format: raw
    source: /var/log/auth.log
    templates:
      - '{rfc3164_time} {event_host} sudo[{process_id}]: pam_unix(sudo:auth): authentication failure; logname={actor} uid=1000 euid=0 tty=/dev/pts/0 ruser={actor} rhost= user={actor}'
      - '{rfc3164_time} {event_host} sudo[{process_id}]: {actor} : 3 incorrect password attempts ; TTY=pts/0 ; PWD=/home/{actor} ; USER=root ; COMMAND=/usr/bin/bash'
      - '{rfc3164_time} {event_host} sudo[{process_id}]: {actor} : TTY=pts/0 ; PWD=/home/{actor} ; USER=root ; COMMAND=/usr/bin/systemctl status sshd'
    fields:
      event_host: [linux-auth-01, linux-auth-02]
      actor: [alice, bob, deploy, ops]
    verify_query: 'search index={index} sourcetype="{sourcetype}" lab_data_source=agtsmith_generator lab_data_version=fidelity_v2 sudo earliest=-24h | stats count'
    min_expected_rows: 1

  linux_su_success:
    domain: linux_auth
    benchmark_case: linux_su_success_test_user_host_b
    format: raw
    source: /var/log/auth.log
    templates:
      - '{rfc3164_time} {event_host} su[{process_id}]: pam_unix(su:session): session opened for user agtsmith_test by {actor}(uid=1000)'
      - '{rfc3164_time} {event_host} su[{process_id}]: (to agtsmith_test) {actor} on pts/1'
    fields:
      event_host: [linux-host-b]
      actor: [alice, deploy]
    verify_query: 'search index={index} sourcetype="{sourcetype}" host="linux-host-b" lab_data_source=agtsmith_generator lab_data_version=fidelity_v2 ("session opened for user agtsmith_test" OR "(to agtsmith_test)") earliest=-24h | stats count'
    min_expected_rows: 1

  linux_su_failure:
    domain: linux_auth
    benchmark_case: linux_failed_su_host_b_7d
    format: raw
    source: /var/log/auth.log
    templates:
      - '{rfc3164_time} {event_host} su[{process_id}]: pam_unix(su:auth): authentication failure; logname={actor} uid=1000 euid=0 tty=pts/1 ruser={actor} rhost= user=agtsmith_test'
      - '{rfc3164_time} {event_host} su[{process_id}]: FAILED SU (to agtsmith_test) {actor} on pts/1'
    fields:
      event_host: [linux-host-b]
      actor: [alice, deploy]
    verify_query: 'search index={index} sourcetype="{sourcetype}" host="linux-host-b" lab_data_source=agtsmith_generator lab_data_version=fidelity_v2 ("pam_unix(su:auth): authentication failure" OR "FAILED SU") earliest=-24h | stats count'
    min_expected_rows: 1

  linux_non_sudoer:
    domain: linux_auth
    benchmark_case: linux_non_sudoer_failure_host_b
    format: raw
    source: /var/log/auth.log
    templates:
      - '{rfc3164_time} {event_host} sudo[{process_id}]: {actor} : user NOT in sudoers ; TTY=pts/1 ; PWD=/home/{actor} ; USER=root ; COMMAND=/usr/bin/id'
    fields:
      event_host: [linux-host-b]
      actor: [agtsmith_test]
    verify_query: 'search index={index} sourcetype="{sourcetype}" host="linux-host-b" lab_data_source=agtsmith_generator lab_data_version=fidelity_v2 "NOT in sudoers" earliest=-24h | stats count'
    min_expected_rows: 1

  linux_syslog: &linux_syslog
    domain: linux_syslog
    benchmark_case: linux_syslog_health_activity
    format: raw
    source: /var/log/messages
    templates:
      - '<30>1 {rfc3339_time} {event_host} systemd {process_id} - - Started {service}.'
      - '<29>1 {rfc3339_time} {event_host} kernel {process_id} - - {interface}: link is {link_state}'
    fields:
      event_host: [linux-core-01, linux-core-02]
      service: [OpenSSH server daemon, System Logging Service, Daily Cleanup of Temporary Directories]
      interface: [eth0, ens160, bond0]
      link_state: [up, ready]
    verify_query: 'search index={index} sourcetype="{sourcetype}" lab_data_source=agtsmith_generator lab_data_version=fidelity_v2 earliest=-24h | stats count'
    min_expected_rows: 1

  linux_syslog_soc:
    <<: *linux_syslog
    domain: linux_syslog_soc
    benchmark_case: linux_syslog_health_activity_soc
    fields:
      event_host: [soc-linux-01, soc-linux-02]
      service: [OpenSSH server daemon, System Logging Service, Audit Logging Service]
      interface: [eth0, ens192, bond0]
      link_state: [up, ready]

  apache_access: &apache_access
    domain: web_access
    benchmark_case: apache_access_top_ips_24h
    format: raw
    source: /var/log/apache2/access.log
    templates:
      - '{clientip} - - [{apache_time}] "GET /index.html HTTP/1.1" 200 1234 "https://portal.example.test/" "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126.0 Safari/537.36"'
      - '{clientip} - - [{apache_time}] "GET /api/v1/health HTTP/1.1" 200 512 "-" "curl/8.5.0"'
    fields:
      event_host: [web-01, web-02]
      clientip: [10.0.0.5, 10.0.0.12, 203.0.113.44, 198.51.100.8]
    verify_query: 'search index={index} sourcetype="{sourcetype}" lab_data_source=agtsmith_generator lab_data_version=fidelity_v2 earliest=-24h | stats count'
    min_expected_rows: 1

  apache_404:
    <<: *apache_access
    benchmark_case: apache_404_spike_24h
    templates:
      - '{clientip} - - [{apache_time}] "GET /admin/login.php HTTP/1.1" 404 512 "-" "Mozilla/5.0 (compatible; security-scanner/2.1)"'
      - '{clientip} - - [{apache_time}] "GET /.env HTTP/1.1" 404 256 "-" "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/126.0 Safari/537.36"'
    fields:
      event_host: [web-01, web-02]
      clientip: [10.0.0.77, 198.51.100.99]
    verify_query: 'search index={index} sourcetype="{sourcetype}" lab_data_source=agtsmith_generator lab_data_version=fidelity_v2 " 404 " earliest=-24h | stats count'

  win_4625: &win_4625
    domain: windows_auth
    benchmark_case: windows_failed_logon_4625_24h
    format: xml
    source: XmlWinEventLog:Security
    payload:
      system:
        provider_name: Microsoft-Windows-Security-Auditing
        provider_guid: '{54849625-5478-4994-A5BA-3E3B0328C30D}'
        event_id: '4625'
        version: '0'
        level: '0'
        task: '12544'
        opcode: '0'
        keywords: '0x8010000000000000'
        event_record_id: '{event_record_id}'
        activity_id: '{activity_id}'
        process_id: '4'
        thread_id: '7260'
        channel: Security
        computer: '{event_host}.contoso.local'
        security_user_id: S-1-5-18
      event_data:
        SubjectUserSid: S-1-5-18
        SubjectUserName: '{event_host}$'
        SubjectDomainName: '{event_host}'
        SubjectLogonId: '0x3e7'
        TargetUserSid: S-1-0-0
        TargetUserName: '{user}'
        TargetDomainName: CONTOSO
        Status: '0xC000006D'
        FailureReason: '%%2313'
        SubStatus: '0xC000006A'
        LogonType: '3'
        LogonProcessName: NtLmSsp
        AuthenticationPackageName: NTLM
        WorkstationName: '{workstation}'
        TransmittedServices: '-'
        LmPackageName: '-'
        KeyLength: '0'
        ProcessId: '0x0'
        ProcessName: '-'
        IpAddress: '{src_ip}'
        IpPort: '{src_port}'
      rendering:
        message: 'An account failed to log on. Account Name: {user}. Source Network Address: {src_ip}. Failure Reason: Unknown user name or bad password.'
        level: Information
        task: Logon
        opcode: Info
    scenario_overrides:
      - event_data:
          Status: '0xC000006D'
          SubStatus: '0xC000006A'
          FailureReason: '%%2313'
      - event_data:
          Status: '0xC000006D'
          SubStatus: '0xC0000064'
          FailureReason: '%%2313'
    fields:
      event_host: [WIN-DC01, WIN-SRV01]
      workstation: [WS-042, WS-117, LPT-022]
      user: [alice, bob, administrator, svc_backup]
      src_ip: [10.0.0.55, 192.168.1.100, 203.0.113.20]
      src_port: [49822, 51214, 58431]
    verify_query: 'search index={index} sourcetype="{sourcetype}" lab_data_source=agtsmith_generator lab_data_version=fidelity_v2 EventID=4625 TargetUserName=* IpAddress=* Status=* SubStatus=* LogonType=* earliest=-24h | stats count'
    min_expected_rows: 1

  win_sysmon_network: &win_sysmon_network
    domain: windows_sysmon
    benchmark_case: windows_sysmon_network_3_24h
    format: xml
    source: XmlWinEventLog:Microsoft-Windows-Sysmon/Operational
    payload:
      system:
        provider_name: Microsoft-Windows-Sysmon
        provider_guid: '{5770385F-C22A-43E0-BF4C-06F5698FFBD9}'
        event_id: '3'
        version: '5'
        level: '4'
        task: '3'
        opcode: '0'
        keywords: '0x8000000000000000'
        event_record_id: '{event_record_id}'
        process_id: '2720'
        thread_id: '3956'
        channel: Microsoft-Windows-Sysmon/Operational
        computer: '{event_host}.contoso.local'
        security_user_id: S-1-5-18
      event_data:
        RuleName: '-'
        UtcTime: '{sysmon_time}'
        ProcessGuid: '{process_guid}'
        ProcessId: '{process_id}'
        Image: '{image}'
        User: '{windows_user}'
        Protocol: '{protocol}'
        Initiated: 'true'
        SourceIsIpv6: 'false'
        SourceIp: '{src_ip}'
        SourceHostname: '{event_host}.contoso.local'
        SourcePort: '{src_port}'
        SourcePortName: '-'
        DestinationIsIpv6: 'false'
