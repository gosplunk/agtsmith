        opcode: Info
    scenario_overrides:
      - event_data:
          Protocol: tcp
          DestinationIp: 10.0.0.20
          DestinationHostname: api.internal.contoso.local
          DestinationPort: '443'
          DestinationPortName: https
      - event_data:
          Protocol: tcp
          DestinationIp: 192.168.1.50
          DestinationHostname: files.contoso.local
          DestinationPort: '80'
          DestinationPortName: http
      - event_data:
          Protocol: udp
          DestinationIp: 8.8.8.8
          DestinationHostname: dns.google
          DestinationPort: '53'
          DestinationPortName: domain
    fields:
      event_host: [WIN-APP01, WIN-WS01]
      image: ['C:\Windows\System32\svchost.exe', 'C:\Program Files\PowerShell\7\pwsh.exe']
      windows_user: ['NT AUTHORITY\NETWORK SERVICE', 'CONTOSO\alice']
      protocol: [tcp, udp]
      src_ip: [10.0.0.5, 10.0.0.12]
      src_port: [49152, 52341, 60122]
    verify_query: 'search index={index} sourcetype="{sourcetype}" lab_data_source=agtsmith_generator lab_data_version=fidelity_v2 EventID=3 Image=* SourceIp=* DestinationIp=* DestinationPort=* Protocol=* ProcessGuid=* earliest=-24h | stats count'
    min_expected_rows: 1

  stream_dns_query:
    domain: stream_dns
    benchmark_case: botsv3_stream_dns_all_time
    format: json
    source: stream:dns
    payload:
      timestamp: '{iso_time}'
      protocol_stack: dns
      transport: udp
      src_ip: '{src_ip}'
      src_port: '{src_port}'
      dest_ip: '{dest_ip}'
      dest_port: 53
      transaction_id: '{transaction_id}'
      query:
        - '{query_name}'
      query_type:
        - A
      query_class:
        - IN
      reply_code: NoError
      answer:
        - name: '{query_name}'
          type: A
          class: IN
          ttl: 300
          data: '{answer_ip}'
    scenario_overrides:
      - reply_code: NoError
      - reply_code: NXDomain
        answer: []
    fields:
      event_host: [stream-sensor-01]
      query_name: [example.com, update.microsoft.com, cdn.example.net]
      src_ip: [10.0.0.5, 10.0.0.88, 192.168.1.10]
      src_port: [53001, 53122, 55210]
      dest_ip: [8.8.8.8, 1.1.1.1, 9.9.9.9]
      answer_ip: [93.184.216.34, 13.107.246.45, 203.0.113.80]
    verify_query: 'search index={index} sourcetype="{sourcetype}" lab_data_source=agtsmith_generator lab_data_version=fidelity_v2 earliest=-24h | spath input=_raw path=query{{}} output=query_name | spath input=_raw path=query_type{{}} output=query_type_name | search query_name=* query_type_name=* src_ip=* dest_ip=* reply_code=* | stats count'
