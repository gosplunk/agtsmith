      user: [deploy, admin, svc_backup]
      src_ip: [203.0.113.10, 198.51.100.20, 10.0.0.15]
    verify_query: 'search index={index} sourcetype="{sourcetype}" lab_data_source=agtsmith_generator lab_data_version=fidelity_v2 eventSource=* eventName=* sourceIPAddress=* userIdentity.arn=* eventTime=* requestID=* eventID=* earliest=-24h | stats count'
