  apache_error_soc:
    domain: web_error_soc
    benchmark_case: apache_error_activity_24h
    format: raw
    source: /var/log/apache2/error.log
    templates:
      - '[{apache_error_time}] [core:error] [pid {process_id}:tid {parent_process_id}] [client {clientip}:{src_port}] AH00126: Invalid URI in request GET /admin/login.php HTTP/1.1'
      - '[{apache_error_time}] [authz_core:error] [pid {process_id}:tid {parent_process_id}] [client {clientip}:{src_port}] AH01630: client denied by server configuration: /var/www/html/.env'
    fields:
      event_host: [soc-web-01, soc-web-02]
      clientip: [10.0.0.77, 198.51.100.99]
      src_port: [49822, 51214]
    verify_query: 'search index={index} sourcetype="{sourcetype}" lab_data_source=agtsmith_generator lab_data_version=fidelity_v2 earliest=-24h | stats count'
    min_expected_rows: 1

  win_4625_soc:
