# Splunk KV Store collections for agent_smith case memory (optional sync from sidecar).

[kvstore]
agent_smith_cases = agent_smith_cases
agent_smith_case_nodes = agent_smith_case_nodes

[agent_smith_cases]
field.case_id = string
field.session_id = string
field.root_question = string
field.status = string
field.created_at = number
field.updated_at = number

[agent_smith_case_nodes]
field.node_id = string
field.case_id = string
field.parent_node_id = string
field.node_type = string
field.question = string
field.title = string
field.intent = string
field.supported = bool
field.row_count = number
field.created_at = number
field.summary = string
field.result_json = string
field.graph_state_json = string
