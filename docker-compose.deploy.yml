name: agtsmith

services:
  agtsmith-case-db:
    image: postgres:16
    container_name: agtsmith-case-db
    environment:
      POSTGRES_DB: "${AGTSMITH_CASE_DB_NAME:-agtsmith}"
      POSTGRES_USER: "${AGTSMITH_CASE_DB_USER:-agtsmith}"
      POSTGRES_PASSWORD: "${AGTSMITH_CASE_DB_PASSWORD:-agtsmith-local-change-me}"
    ports:
      - "127.0.0.1:${AGTSMITH_CASE_DB_EXPOSE:-5432}:5432"
    volumes:
      - agtsmith_deploy_case_db:/var/lib/postgresql/data
    restart: unless-stopped

  agtsmith-ui-deploy:
    build:
      context: .
      dockerfile: Dockerfile.deploy
      # Match the host-network runtime and avoid daemon-local DNS drift during builds.
      network: host
      args:
        AGTSMITH_SOURCE_REVISION: "${AGTSMITH_SOURCE_REVISION:?run make docker-deploy-up}"
        AGTSMITH_BUILD_ID: "${AGTSMITH_BUILD_ID:?run make docker-deploy-up}"
    image: "${AGTSMITH_DEPLOY_IMAGE:?run make docker-deploy-up}"
    pull_policy: never
    container_name: agtsmith-ui-deploy
    labels:
      org.opencontainers.image.revision: "${AGTSMITH_SOURCE_REVISION:?run make docker-deploy-up}"
      io.agtsmith.build-id: "${AGTSMITH_BUILD_ID:?run make docker-deploy-up}"
    depends_on:
      - agtsmith-case-db
    network_mode: host
    environment:
      PYTHONPATH: /app:/app/scripts
      AGTSMITH_SOURCE_REVISION: "${AGTSMITH_SOURCE_REVISION:?run make docker-deploy-up}"
      AGTSMITH_BUILD_ID: "${AGTSMITH_BUILD_ID:?run make docker-deploy-up}"
      AGTSMITH_CASE_DB_HOST: 127.0.0.1
      AGTSMITH_CASE_DB_PORT: "5432"
      AGTSMITH_CASE_DB_NAME: "${AGTSMITH_CASE_DB_NAME:-agtsmith}"
      AGTSMITH_CASE_DB_USER: "${AGTSMITH_CASE_DB_USER:-agtsmith}"
      AGTSMITH_CASE_DB_PASSWORD: "${AGTSMITH_CASE_DB_PASSWORD:-agtsmith-local-change-me}"
    volumes:
      - agtsmith_deploy_config:/app/config
      - agtsmith_deploy_artifacts:/app/artifacts
      # Host journal read-only access for Ollama Ops log tailing (systemd Ollama on Linux).
      - /run/systemd/journal:/run/systemd/journal:ro
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
    restart: unless-stopped

volumes:
  agtsmith_deploy_config:
  agtsmith_deploy_artifacts:
  agtsmith_deploy_case_db:
